<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PVT-BA Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #instructions {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.2em;
    }
    #stimulus {
      width: 200px;
      height: 200px;
      background: #444;
      border-radius: 16px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      user-select: none;
      transition: background 0.2s;
    }
    #feedback {
      margin: 10px 0;
      min-height: 1.5em;
      font-size: 1.1em;
      color: #ffd700;
    }
    #startBtn, #resultsBtn {
      padding: 10px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      margin: 8px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startBtn:active, #resultsBtn:active {
      background: #2563eb;
    }
    #results {
      margin-top: 20px;
      background: #333;
      padding: 16px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    @media (max-width: 500px) {
      #stimulus {
        width: 90vw;
        height: 35vw;
        font-size: 1.5em;
      }
      #results {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="instructions">
      Tap the box <b>as soon as it turns green</b>.<br>
      Don't tap before it turns green!<br>
      The test will end automatically.
    </div>
    <div id="stimulus">Ready?</div>
    <div id="feedback"></div>
    <button id="startBtn">Start Test</button>
    <button id="resultsBtn" style="display:none;">Show Previous Results</button>
    <div id="results" style="display:none;"></div>
  </div>
  <script>
    // --- PVT-BA Algorithm Variables ---
    let pHigh = 1/3, pMedium = 1/3, pLow = 1/3;
    const decisionThreshold = 0.985; // Slightly lower for ~1min test
    let lapses = 0, falseStarts = 0, responses = [];
    let running = false, waiting = false;
    let stimTimeout = null, stimOn = false, stimStart = 0;
    let responseCount = 0;
    let intervalStart = 0;
    let prevResults = [];
    let timeOnTask = 0;

    // --- DOM Elements ---
    const stimulus = document.getElementById('stimulus');
    const feedback = document.getElementById('feedback');
    const startBtn = document.getElementById('startBtn');
    const resultsBtn = document.getElementById('resultsBtn');
    const resultsDiv = document.getElementById('results');
    const instructions = document.getElementById('instructions');

    // --- Utility Functions ---
    function randBetween(a, b) {
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }
    function getTimeInterval() {
      // Returns 0 for first 30s, 1 for 30-60s, 2 for >60s
      if (timeOnTask < 30000) return 0;
      if (timeOnTask < 60000) return 1;
      return 2;
    }
    function getLikelihoodRatio(category, isLpFS, interval) {
      // Example values from Basner's paper, simplified for demo
      // These should be tuned with real data for production
      // [interval0, interval1, interval2]
      const LR = {
        high: { normal: [0.7, 0.8, 0.85], lapse: [0.2, 0.3, 0.4] },
        low:  { normal: [1.3, 1.2, 1.15], lapse: [2.5, 2.2, 2.0] }
      };
      if (category === 'high') {
        return isLpFS ? LR.high.lapse[interval] : LR.high.normal[interval];
      } else if (category === 'low') {
        return isLpFS ? LR.low.lapse[interval] : LR.low.normal[interval];
      }
      return 1;
    }
    function storeTestResult(result) {
      let results = JSON.parse(localStorage.getItem('pvtResults') || '[]');
      results.push(result);
      localStorage.setItem('pvtResults', JSON.stringify(results));
    }
    function getPreviousResults() {
      return JSON.parse(localStorage.getItem('pvtResults') || '[]');
    }
    function getRecentPerformance(results) {
      // Returns {HIGH, MEDIUM, LOW} frequencies from last 5 tests
      let last = results.slice(-5);
      let freq = {HIGH:0, MEDIUM:0, LOW:0};
      last.forEach(r => freq[r.performance]++);
      let total = last.length || 1;
      return {
        HIGH: freq.HIGH/total,
        MEDIUM: freq.MEDIUM/total,
        LOW: freq.LOW/total
      };
    }
    function initializeProbabilities() {
      let results = getPreviousResults();
      if (results.length > 0) {
        let perf = getRecentPerformance(results);
        pHigh = perf.HIGH*0.8 + (1/3)*0.2;
        pMedium = perf.MEDIUM*0.8 + (1/3)*0.2;
        pLow = perf.LOW*0.8 + (1/3)*0.2;
      } else {
        pHigh = pMedium = pLow = 1/3;
      }
    }

    // --- PVT-BA Logic ---
    function resetTest() {
      lapses = 0; falseStarts = 0; responses = [];
      running = false; waiting = false; stimOn = false;
      responseCount = 0; timeOnTask = 0;
      initializeProbabilities();
      feedback.textContent = '';
      stimulus.textContent = 'Ready?';
      stimulus.style.background = '#444';
      startBtn.style.display = '';
      resultsBtn.style.display = '';
      resultsDiv.style.display = 'none';
      instructions.style.display = '';
    }
    function startTest() {
      resetTest();
      running = true;
      startBtn.style.display = 'none';
      resultsBtn.style.display = 'none';
      instructions.style.display = 'none';
      nextStimulus();
    }
    function nextStimulus() {
      waiting = true;
      stimOn = false;
      let isi = randBetween(1000, 4000 - responseCount*100);
      if (isi < 1200) isi = 1200;
      stimulus.textContent = '';
      stimulus.style.background = '#444';
      stimTimeout = setTimeout(() => {
        stimOn = true;
        waiting = false;
        stimStart = performance.now();
        intervalStart = stimStart;
        stimulus.style.background = '#22c55e';
        stimulus.textContent = 'Tap!';
      }, isi);
    }
    function handleTap() {
      if (!running) return;
      let now = performance.now();
      if (waiting && !stimOn) {
        // False start
        falseStarts++;
        feedback.textContent = 'Too soon! (False Start)';
        responses.push({type:'FS', rt:0, time: now});
        updateProbabilities(0, true);
        if (checkStopCriteria()) return endTest();
        clearTimeout(stimTimeout);
        setTimeout(nextStimulus, 700);
        return;
      }
      if (stimOn) {
        let rt = now - stimStart;
        responseCount++;
        timeOnTask += rt;
        let isLapse = rt >= 355;
        if (isLapse) lapses++;
        feedback.textContent = `RT: ${Math.round(rt)} ms${isLapse ? ' (Lapse)' : ''}`;
        responses.push({type:'RT', rt: rt, time: now});
        updateProbabilities(rt, isLapse);
        if (checkStopCriteria()) return endTest();
        stimOn = false;
        setTimeout(nextStimulus, 700);
      }
    }
    function updateProbabilities(rt, isLpFS) {
      let interval = getTimeInterval();
      // Convert to odds
      let oddHigh = pHigh / (1 - pHigh);
      let oddLow = pLow / (1 - pLow);
      oddHigh *= getLikelihoodRatio('high', isLpFS, interval);
      oddLow *= getLikelihoodRatio('low', isLpFS, interval);
      // Convert back to probabilities
      pHigh = oddHigh / (1 + oddHigh);
      pLow = oddLow / (1 + oddLow);
      pMedium = 1 - pHigh - pLow;
      // Special rule: If LpFS > 6, set pHigh to zero
      if (lapses + falseStarts > 6) {
        pHigh = 0;
        let sum = pMedium + pLow;
        pMedium /= sum;
        pLow /= sum;
      }
    }
    function checkStopCriteria() {
      if (pHigh > decisionThreshold || pMedium > decisionThreshold || pLow > decisionThreshold) return true;
      if (lapses + falseStarts > 16) {
        pLow = 1; pHigh = 0; pMedium = 0;
        return true;
      }
      return false;
    }
    function endTest() {
      running = false;
      let performance = pHigh > decisionThreshold ? 'HIGH' : pMedium > decisionThreshold ? 'MEDIUM' : 'LOW';
      let avgRT = responses.filter(r=>r.type==='RT').reduce((a,b)=>a+b.rt,0) / Math.max(1,responses.filter(r=>r.type==='RT').length);
      let result = {
        date: new Date().toLocaleString(),
        performance,
        lapses,
        falseStarts,
        avgRT: Math.round(avgRT),
        responses: responses.length
      };
      storeTestResult(result);
      feedback.textContent = '';
      stimulus.textContent = 'Done!';
      stimulus.style.background = '#444';
      setTimeout(() => {
        showResults(result, true);
      }, 600);
    }
    function showResults(result, current=false) {
      let html = `<b>Test Result (${result.date}):</b><br>
        <b>Performance:</b> ${result.performance}<br>
        <b>Lapses:</b> ${result.lapses}<br>
        <b>False Starts:</b> ${result.falseStarts}<br>
        <b>Avg RT:</b> ${result.avgRT} ms<br>
        <b>Responses:</b> ${result.responses}`;
      if (!current) {
        let all = getPreviousResults();
        if (all.length === 0) html = "No previous results.";
        else {
          html = "<b>Previous Results:</b><br>";
          all.slice(-5).reverse().forEach(r => {
            html += `${r.date}: <b>${r.performance}</b> (Lapses: ${r.lapses}, FS: ${r.falseStarts}, Avg RT: ${r.avgRT}ms)<br>`;
          });
        }
      }
      resultsDiv.innerHTML = html;
      resultsDiv.style.display = '';
      startBtn.style.display = '';
      resultsBtn.style.display = '';
    }

    // --- Event Listeners ---
    stimulus.addEventListener('touchstart', handleTap);
    stimulus.addEventListener('mousedown', handleTap);
    startBtn.addEventListener('click', startTest);
    resultsBtn.addEventListener('click', () => showResults({}, false));

    // --- On Load ---
    window.onload = function() {
      resetTest();
      prevResults = getPreviousResults();
      if (prevResults.length > 0) resultsBtn.style.display = '';
    }
  </script>
</body>
</html>
