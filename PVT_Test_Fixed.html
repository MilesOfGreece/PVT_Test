<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Reaction Time Test</title>
    <style>
      /* Reset basic styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center; /* Center horizontally */
        height: 100vh; /* Full viewport height */
        margin: 0;
      }

      #message {
        font-size: 48px; /* Adjusted font size for better readability */
        margin-top: 20px; /* Move the "Tap Now" message up by 50px (original margin-top was 70px) */
        margin-bottom: 40px; /* Add spacing below the message */
      }

      #results {
        margin-top: 20px;
        font-size: 36px;
      }

      #timer {
        font-size: 36px;
        margin-top: 0px; /* Move the timer up by 50px (original margin-top was 20px) */
        display: none;
      }

      #dot {
        width: 150px; /* Size of the dot */
        height: 150px;
        background-color: red;
        border-radius: 50%;
        display: none;
        cursor: pointer;
        position: absolute;
        top: 35%; /* Adjusted to move the dot further up */
        left: 50%; /* Center horizontally */
        transform: translate(-50%, -50%); /* Adjust for element size */
      }

      #distractionPrompt {
        font-size: 36px; /* Match the size of other large text */
        margin-top: 20px;
        text-align: center;
      }

      #distractionPrompt button {
        font-size: 24px; /* Match the size of other buttons */
        padding: 15px 30px; /* Add padding for larger buttons */
        margin: 10px; /* Add spacing between buttons */
        cursor: pointer;
      }

      #buttonContainer {
        display: flex;
        justify-content: center; /* Center the buttons horizontally */
        gap: 20px; /* Add spacing between the buttons */
        margin-top: 20px; /* Add some margin above the buttons */
      }

      #startButton,
      #resetButton {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
      }

      #startButton {
        background-color: #4caf50; /* Green background */
        color: white; /* White text */
      }

      #resetButton {
        background-color: #f44336; /* Red background */
        color: white; /* White text */
      }

      /* Media query for smaller screens (e.g., mobile devices) */
      @media (max-width: 600px) {
        body {
          padding-top: 100px; /* Shift everything down by 100 pixels */
        }

        #message {
          font-size: 24px; /* Make the text smaller */
          margin-top: 25px; /* Push the text down by 100px for mobile (original margin-top was 10px) */
          margin-bottom: 10px;
        }

        #results {
          font-size: 20px; /* Make the results text smaller */
        }

        #timer {
          margin-top: 20px;
          font-size: 18px; /* Make the timer text smaller */
        }

        #startButton {
          padding: 8px 16px; /* Adjust padding for smaller buttons */
          font-size: 16px; /* Make the button text smaller */
        }

        #dot {
          width: 100px; /* Slightly smaller size for mobile */
          height: 100px;
          top: calc(30% + 100px); /* Move the dot down by 200px */
        }

        #distractionPrompt {
          font-size: 20px; /* Adjust text size for smaller screens */
        }

        #distractionPrompt button {
          font-size: 16px; /* Adjust button size for smaller screens */
          padding: 8px 16px; /* Adjust padding for smaller buttons */
        }
      }

      /* Media query for iPhone 14 Pro Max (screen width: 430px) */
      @media (max-width: 430px) {
        #dot {
          top: 20%; /* Move the red dot closer to the top */
        }

        #message {
          margin-top: 10px; /* Move the "Tap Now" message closer to the top */
        }

        #timer {
          margin-top: 5px; /* Move the timer closer to the top */
        }
      }
    </style>
  </head>
  <body>
    <div id="message">
      Wait for the red dot and tap it with your dominant finger when it appears.
      You'll do this 10 times.
    </div>
    <div id="buttonContainer">
      <button
        id="startButton"
        onclick="startTest()"
      >
        Start Test
      </button>
      <button id="resetButton" onclick="resetLocalStorage()">Reset Data</button>
    </div>
    <div id="timer">Time: 0 ms</div>
    <div id="dot"></div>
    <div id="results"></div>
    <div
      id="distractionPrompt"
      style="display: none"
    >
      <p>Were you distracted during the test?</p>
      <button id="yesButton">Yes</button>
      <button id="noButton">No</button>
    </div>

    <form
      id="CaptureForm"
      style="display: none"
    >
      <input
        type="text"
        name="vablet_Time_1"
      />
      <input
        type="text"
        name="vablet_Time_2"
      />
      <input
        type="text"
        name="vablet_Time_3"
      />
      <input
        type="text"
        name="vablet_Time_4"
      />
      <input
        type="text"
        name="vablet_Time_5"
      />
      <input
        type="text"
        name="vablet_Time_6"
      />
      <input
        type="text"
        name="vablet_Time_7"
      />
      <input
        type="text"
        name="vablet_Time_8"
      />
      <input
        type="text"
        name="vablet_Time_9"
      />
      <input
        type="text"
        name="vablet_Time_10"
      />
      <input
        type="text"
        name="vablet_Time_11"
      />
      <input
        type="text"
        name="vablet_Time_12"
      />  
      <input
        type="text"
        name="vablet_Time_13"
      />
      <input
        type="text"
        name="vablet_Time_14"
      />
      <input
        type="text"
        name="vablet_Time_15"
      />
      <input
        type="text"
        name="vablet_Time_16"
      />
      <input
        type="text"
        name="vablet_Time_17"
      />
      <input
        type="text"
        name="vablet_Time_18"
      />
      <input
        type="text"
        name="vablet_Time_19"
      />
      <input
        type="text"
        name="vablet_Time_20"
      />
      <input
        type="text"
        name="vablet_Time_Avg"
      />
      <input
        type="text"
        name="vablet_Distracted"
      />
      <input
        type="text"
        name="vablet_stdDev_1"
      />
      <input
        type="text"
        name="vablet_stdDev_2"
      />
      <input
        type="text"
        name="vablet_Score"
      />
      <input
        type="text"
        name="vablet_Score_2"
      />
    </form>

    <script>
      const dot = document.getElementById('dot');
      const message = document.getElementById('message');
      const results = document.getElementById('results');
      const startButton = document.getElementById('startButton');
      const timer = document.getElementById('timer');

      let clickTimes = [];
      let startTime;
      let trial = 0;
      const totalTrials = 10;
      let timerInterval
      let dotVisible = false; // Track whether the dot is visible
      let trialTimeout; // Variable to store the setTimeout ID
      let roundTimeout; // Variable to store the timeout for each round
      let testInProgress = false; // Track whether the test is in progress

      function startTest() {
        document.getElementById('resetButton').style.display = 'none'; // Hide the reset button
        trial = 0;
        clickTimes = [];
        results.innerHTML = '';
        startButton.style.display = 'none'; // Hide the start button
        testInProgress = true; // Set the test as in progress
        nextTrial();
      }

      function nextTrial() {
        dot.style.display = 'none';
        timer.style.display = 'none'; // Hide the timer initially
        message.textContent = 'Wait for it...'; // Reset the message
        dotVisible = false; // Reset visibility flag

        // Clear any existing timeouts to prevent overlapping trials
        if (trialTimeout) {
          clearTimeout(trialTimeout);
        }
        if (roundTimeout) {
          clearTimeout(roundTimeout);
        }

        const delay = 2000 + Math.random() * 6000; // 2 to 8 seconds
        trialTimeout = setTimeout(() => {
          dot.style.display = 'block'; // Show the dot
          timer.style.display = 'block'; // Show the timer
          message.textContent = 'Tap Now!'; // Update the message when the dot appears
          startTime = performance.now(); // CHANGED HERE
          dotVisible = true; // Set visibility flag to true
          startTimer();

          // Set a timeout for 6 seconds to move to the next round if the user doesn't click
          roundTimeout = setTimeout(() => {
            if (dotVisible) {
              // If the dot is still visible after 10 seconds, record a "Timeout"
              clickTimes.push('Timeout');
              message.textContent = 'You missed! Moving to the next round.';
              dot.style.display = 'none'; // Hide the dot
              stopTimer(); // Stop the timer
              trial++;
              if (trial < totalTrials) {
                setTimeout(nextTrial, 2000); // Wait 2 seconds before starting the next trial
              } else {
                endTest();
              }
            }
          }, 6000); // 10-second timeout
        }, delay);
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          const elapsedTime = performance.now() - startTime; // CHANGED HERE
          timer.textContent = `Time: ${elapsedTime.toFixed(0)} ms`;
        }, 10); // Update every 10 milliseconds
      }

      function stopTimer() {
        clearInterval(timerInterval);
        if (roundTimeout) {
          clearTimeout(roundTimeout); // Clear the round timeout if the user clicks the dot
        }
      }

      document.addEventListener('click', (event) => {
        // Ignore clicks if the test is not in progress
        if (!testInProgress) {
          message.textContent =
            "Test finished! Click 'Start Test' to try again.";
          return;
        }

        // Ignore clicks on the "Start Test" button
        if (event.target === startButton) {
          return;
        }

        if (!dotVisible) {
          // False start: user clicked before the dot appeared
          message.textContent = 'False Start! Try again.';
          clickTimes.push('False Start'); // Record "False Start" as the result
          trial++;

          // Clear the timeout to prevent the dot from appearing
          if (trialTimeout) {
            clearTimeout(trialTimeout);
          }

          if (trial < totalTrials) {
            setTimeout(nextTrial, 2000); // Wait 2 seconds before starting the next trial
          } else {
            endTest();
          }
          return;
        }

        const rt = performance.now() - startTime; // CHANGED HERE
        clickTimes.push(rt);
        stopTimer(); // Stop the timer when the dot is clicked
        trial++;
        if (trial < totalTrials) {
          nextTrial();
        } else {
          endTest();
        }
      });

      function calculateStandardDeviation(values) {
        if (values.length === 0) return 'N/A'; // Return "N/A" if there are no values
      
        const mean = values.reduce((a, b) => a + b, 0) / values.length;
        const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values.length;
        return Math.sqrt(variance).toFixed(2); // Return the standard deviation rounded to 2 decimal places
      }

      function endTest() {
        dot.style.display = 'none';
        timer.style.display = 'none'; // Hide the timer when the test is done
        message.textContent = 'Test finished!';
        testInProgress = false; // Set the test as not in progress
        startButton.style.display = 'none'; // Hide the start button
        const distractionPrompt = document.getElementById('distractionPrompt');
        distractionPrompt.style.display = 'block'; // Show the distraction prompt

        // Save the results (only valid rounds) to localStorage
        saveResults(clickTimes);

        // Handle "Yes" and "No" button clicks
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        yesButton.onclick = () => {
          localStorage.setItem('vablet_Distracted', 'Yes'); // Set distraction status to Yes
          distractionPrompt.style.display = 'none'; // Hide the prompt
          showCombinedResults('Yes');
          sendScore(); // Send the score after the user responds
        };

        noButton.onclick = () => {
          localStorage.setItem('vablet_Distracted', 'No'); // Set distraction status to No
          distractionPrompt.style.display = 'none'; // Hide the prompt
          showCombinedResults('No');
          sendScore(); // Send the score after the user responds
        };
      }

      function showCombinedResults(distractedStatus) {
        const previousResults = getPreviousResults();
        const average = JSON.parse(localStorage.getItem('reactionTestAverage')) || 'N/A'; // Default to "N/A" if missing

        // Filter numeric values for the current test
        const currentNumericResults = clickTimes.filter((time) => typeof time === 'number');
        const currentStdDev = calculateStandardDeviation(currentNumericResults);

        // Filter numeric values for the last 20 rounds
        const previousNumericResults = previousResults.filter((result) => typeof result === 'number');
        const previousStdDev = calculateStandardDeviation(previousNumericResults);

        // Calculate the score
        const avgRT =
          currentNumericResults.length > 0
            ? Math.round(
                currentNumericResults.reduce((a, b) => a + b, 0) / currentNumericResults.length
              )
            : "N/A";
        const lapses = clickTimes.filter((time) => typeof time === 'number' && time >= 600).length;
        const falseStarts = clickTimes.filter((time) => time === 'False Start').length;
        const rtStdDev = parseFloat(currentStdDev) || 0;
        let score;

        if (avgRT == "N/A") {
          score = "Fail"
        } else {
          score = Math.round(avgRT * 0.3 + lapses * 10 + falseStarts * 5 + rtStdDev * 0.2);
        }

        // Determine status and color based on the score
        let status = '';
        let color = '';

        if (score <= 140) {
          status = 'Normal Alertness';
          color = 'green';
        } else if (score <= 180) {
          status = 'Mild Impairment';
          color = 'orange';
        } else if (score != "Fail") {
          status = 'High Impairment';
          color = 'red';
        } else {
          status = "Failed test! No rounds completed."
          color = 'red';
        }

        const currentResultsHTML = `
          <h3>Current Test Results</h3>
          <p>Reaction times (ms): ${clickTimes.map(r => typeof r === 'number' ? Math.round(r) : r).join(', ')}</p>
          <p>Average (excluding false starts and timeouts): ${avgRT} ms</p>
          <p>Standard Deviation: ${currentStdDev} ms</p>
          <p>Distracted: ${distractedStatus}</p>
          <p style="color: ${color}; font-weight: bold;">Score: ${score} (${status})</p>
        `;

        const previousResultsHTML = `
          <h3>Previous Results (Last 20 Rounds)</h3>
          <p>${
  previousResults.map(r => typeof r === 'number' ? Math.round(r) : r).join(', ')
} ms</p>
          <p>Average of last 20 rounds: ${average} ms</p>
          <p>Standard Deviation of last 20 rounds: ${previousStdDev} ms</p>
        `;

        results.innerHTML = currentResultsHTML + previousResultsHTML;
        startButton.style.display = 'block'; // Show the start button again
      }

      function generateResults() {
        const validTimes = clickTimes.filter((time) => time !== 'False Start' && time !== 'Timeout');
        const avg =
          validTimes.length > 0
            ? Math.round(validTimes.reduce((a, b) => a + b, 0) / validTimes.length)
            : 'N/A';
        const stdDev = calculateStandardDeviation(validTimes);

        return `
          <p>Reaction times (ms): ${clickTimes.join(', ')}</p>
          <p>Average (excluding false starts and timeouts): ${avg} ms</p>
          <p>Standard Deviation: ${stdDev} ms</p>
        `;
      }

      function saveResults(newRounds) {
        // Retrieve existing results from localStorage
        const savedResults =
          JSON.parse(localStorage.getItem('reactionTestResults')) || [];

        // Add new rounds to the existing results
        const updatedResults = [...savedResults, ...newRounds];

        // Keep only the most recent 20 rounds
        const trimmedResults = updatedResults.slice(-20);
        localStorage.setItem(
          'reactionTrimmedResults',
          JSON.stringify(trimmedResults)
        );

        // Save the updated results back to localStorage
        localStorage.setItem(
          'reactionTestResults',
          JSON.stringify(trimmedResults)
        );

        // Filter out non-numeric values (e.g., "False Start" and "Timeout")
        const numericResults = trimmedResults.filter((result) => typeof result === 'number');

        // Calculate the average of the numeric results
        const average =
          numericResults.length > 0
            ? Math.round(numericResults.reduce((a, b) => a + b, 0) / numericResults.length)
            : 'N/A'; // Default to "N/A" if there are no numeric results

        const averageLast10 = trimmedResults.slice(-10); // Get the last 10 rounds for average calculation
        const averageLast10Numeric = averageLast10.filter((result) => typeof result === 'number'); // Filter numeric values
        const averageLast10Value =
          averageLast10Numeric.length > 0
            ? Math.round(averageLast10Numeric.reduce((a, b) => a + b, 0) / averageLast10Numeric.length)
            : 'N/A'; // Default to "N/A" if there are no numeric results
        // Save the average of the last 10 rounds to localStorage
        localStorage.setItem('reactionTestAverageLast10', JSON.stringify(averageLast10Value));

        // Save the average to localStorage
        localStorage.setItem('reactionTestAverage', JSON.stringify(average));

        // Calculate the standard deviation
        const stdDev = calculateStandardDeviation(averageLast10Numeric);

        // Save the standard deviations to localStorage
        const stdDev1 = localStorage.getItem('vablet_stdDev_1');
        const oldStdDev = stdDev1 && stdDev1 !== "N/A" ? JSON.parse(stdDev1) : "N/A";

        localStorage.setItem('vablet_stdDev_2', oldStdDev); // Save the previous stdDev to stdDev_2
        localStorage.setItem('vablet_stdDev_1', stdDev);    // Save the current stdDev to stdDev_1

        // Calculate the score
        const lapses = clickTimes.filter((time) => typeof time === 'number' && time >= 600).length;
        const falseStarts = newRounds.filter((time) => time === 'False Start').length;

        let score = 0

        if (averageLast10Value == "N/A") {
          score = "Fail"
          console.log("Score: ", score)
        } else {
          score += Math.round(averageLast10Value * 0.3 + lapses * 10 + falseStarts * 5 + stdDev * 0.2);
          console.log("Score: ", score)
        }

        // Save the score to localStorage
        const savedScores = JSON.parse(localStorage.getItem('reactionTestScores')) || [];
        const updatedScores = [...savedScores, score].slice(-2); // Keep only the last 2 scores
        localStorage.setItem('reactionTestScores', JSON.stringify(updatedScores));

        localStorage.setItem('vablet_Score', score);
        localStorage.setItem('vablet_Score_2', updatedScores.length > 1 ? updatedScores[0] : "N/A"); // Handle case with only one score

        console.log('Saved results:', trimmedResults); // Log the saved results for debugging
        console.log('Average of last 20 rounds:', average); // Log the average for debugging
        console.log('Saved scores:', updatedScores); // Log the saved scores for debugging
        console.log('Saved standard deviations:', stdDev); // Log the standard deviation for debugging
      }

      function getPreviousResults() {
        // Retrieve and parse results from localStorage
        return JSON.parse(localStorage.getItem('reactionTestResults')) || [];
      }

      function displayPreviousResults() {
        // Retrieve previous results from localStorage
        const previousResults = JSON.parse(localStorage.getItem('reactionTestResults')) || [];
        const average = JSON.parse(localStorage.getItem('reactionTestAverage')) || 'N/A'; // Default to "N/A" if missing
        const savedScores = JSON.parse(localStorage.getItem('reactionTestScores')) || []; // Retrieve the last two scores

        // Filter numeric values for standard deviation calculation
        const numericResults = previousResults.filter((result) => typeof result === 'number');
        const stdDev = calculateStandardDeviation(numericResults);

        // Generate HTML for the last two scores with color coding
        const lastTwoScoresHTML = savedScores.length > 0
          ? savedScores
              .map((score) => {
                let status = '';
                let color = '';

                if (score <= 140) {
                  status = 'Normal Alertness';
                  color = 'green';
                } else if (score <= 180) {
                  status = 'Mild Impairment';
                  color = 'orange';
                } else {
                  status = 'High Impairment';
                  color = 'red';
                }

                return `<p style="color: ${color}; font-weight: bold;">Score: ${score} (${status})</p>`;
              })
              .join('')
          : '<p>No scores available</p>';

        // Generate HTML for previous results
        const previousResultsHTML = previousResults.length > 0
          ? `
            <h3>Previous Results (Last 20 Rounds)</h3>
            <p>${previousResults.map(r => typeof r === 'number' ? Math.round(r) : r).join(', ')} ms</p>
            <p>Average of last 20 rounds: ${average} ms</p>
            <p>Standard Deviation of last 20 rounds: ${stdDev} ms</p>
            <h3>Last Two Scores</h3>
            ${lastTwoScoresHTML}
          `
          : '<p>No previous results available</p>';

        // Update the results element
        results.innerHTML = previousResultsHTML;
      }

      function assignScoresToInputs() {
        // Retrieve the last 20 rounds from localStorage
        const trimmedResults = JSON.parse(
          localStorage.getItem('reactionTrimmedResults') || '[]'
        );

        // Assign scores to the form inputs
        for (let i = 0; i < trimmedResults.length; i++) {
          document.querySelector(`input[name="vablet_Time_${i + 1}"]`).value =
            trimmedResults[i];
        }

        // Set the average score in the form
        const average = localStorage.getItem('reactionTestAverage');
        document.querySelector('input[name="vablet_Time_Avg"]').value =
          average !== 'N/A' ? JSON.parse(average) : 0; // Handle "N/A" case

        // Set the distraction status in the form
        document.querySelector('input[name="vablet_Distracted"]').value =
          localStorage.getItem('vablet_Distracted') || '';

        // Set the standard deviations in the form
        const stdDev1 = localStorage.getItem('vablet_stdDev_1');
        const stdDev2 = localStorage.getItem('vablet_stdDev_2');
        document.querySelector('input[name="vablet_stdDev_1"]').value =
          stdDev1 !== 'N/A' ? JSON.parse(stdDev1) : 0; // Handle "N/A" case
        document.querySelector('input[name="vablet_stdDev_2"]').value =
          stdDev2 !== 'N/A' ? JSON.parse(stdDev2) : 0; // Handle "N/A" case

        // Set the scores in the form
        const savedScores = JSON.parse(localStorage.getItem('reactionTestScores') || '[]'); // Retrieve the last two scores
        const score = savedScores.length > 0 ? savedScores[savedScores.length - 1] : 0; // Default to 0 if missing
        const score2 = savedScores.length > 1 ? savedScores[savedScores.length - 2] : 0; // Default to 0 if missing
        document.querySelector('input[name="vablet_Score"]').value = score;
        document.querySelector('input[name="vablet_Score_2"]').value = score2; // Set the second score
      }

      function sendScore() {
        assignScoresToInputs(); // Assign scores to the form inputs

        try {
          // Submit the form as a survey
          VabletFormTools.sendFormAsSurvey('CaptureForm', () => {
            console.log('Form submitted with average score:', average);

            // Close the file using VabletNativeInterface
            VabletNativeInterface.callNativeMethod('CloseFile', {
              fileId: currentVabletFileInfo.fileId,
            });
          });
        } catch (error) {
          console.log('Error: ', error);
        }
      }

      function resetLocalStorage() {
        localStorage.clear(); // Clear all localStorage data
        console.log('LocalStorage data has been reset.');
        document.getElementById('resetButton').style.display = 'none'; // Hide the reset button
      }

      // Call this function when the page loads
      window.onload = displayPreviousResults;
    </script>
  </body>
</html>
